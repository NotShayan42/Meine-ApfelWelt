<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/blueimp-md5/2.19.0/js/md5.min.js"></script>
  <!--
  Verwendet: blueimp-md5 (https://github.com/blueimp/JavaScript-MD5)
  Copyright (c) 2011–2021 Sebastian Tschan
  Lizenziert unter der MIT-Lizenz: https://opensource.org/licenses/MIT
-->
  <script src="secret.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-body">
  <div class="login-box">
    <form id="loginForm">
      <h1 class="login-title">Bitte Passwort eingeben</h1>
      <p id="error-msg" class="login-error"></p>
      <input
        type="password"
        id="password"
        placeholder="Passwort"
        required
        class="login-input"/>
      <button type="submit" class="login-button">Login</button>
    </form>
  </div>
</body>
</html>
